name: Build iOS IPA

on:
  push:
    branches: [main]
    tags: ['v*', 'ios-*']
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ios

env:
  XCODE_PROJECT: WebrtcPhone.xcodeproj
  SCHEME: WebrtcPhone
  CONFIGURATION: Release

jobs:
  build:
    name: Archive & Package unsigned IPA
    runs-on: macos-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$SCHEME"

      - name: Show build settings
        run: xcodebuild -showBuildSettings -project "$XCODE_PROJECT" -scheme "$SCHEME" -configuration "$CONFIGURATION" | head -40

      - name: Clean derived data
        run: rm -rf ~/Library/Developer/Xcode/DerivedData/WebrtcPhone-*

      - name: Build archive (unsigned)
        run: |
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -archivePath "$RUNNER_TEMP/WebrtcPhone.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO

      - name: Export unsigned IPA
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/WebrtcPhone.xcarchive"
          APP=$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP" ]; then
            echo "No .app found in archive" >&2
            exit 1
          fi
          # XcodeGen 未把 Assets.xcassets 编入 build phase 时，手动按 CFBundleIconFiles 声明注入图标
          ICONSET="$GITHUB_WORKSPACE/ios/Resources/Assets.xcassets/AppIcon.appiconset"
          cp "$ICONSET/AppIcon-60@2x.png" "$APP/AppIcon60x60@2x.png"
          cp "$ICONSET/AppIcon-60@3x.png" "$APP/AppIcon60x60@3x.png"
          cp "$ICONSET/AppIcon-76.png" "$APP/AppIcon76x76.png"
          cp "$ICONSET/AppIcon-76@2x.png" "$APP/AppIcon76x76@2x.png"
          cp "$ICONSET/AppIcon-83.5@2x.png" "$APP/AppIcon83.5x83.5@2x.png"
          cp "$ICONSET/AppIcon-1024.png" "$APP/AppIcon1024x1024.png"
          echo "Icons injected:"
          ls -1 "$APP"/AppIcon*.png
          # 修正 Info.plist：XcodeGen 默认生成的 plist 缺失显示名/ATS/图标声明，写入完整 plist 覆盖
          cat > "$RUNNER_TEMP/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleDisplayName</key>
            <string>穿云投屏</string>
            <key>CFBundleExecutable</key>
            <string>WebrtcPhone</string>
            <key>CFBundleIdentifier</key>
            <string>com.webrtcphone.ios</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>穿云投屏</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>0.4.5</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>16.0</string>
            <key>UILaunchScreen</key>
            <dict/>
            <key>UIApplicationSceneManifest</key>
            <dict>
              <key>UIApplicationSupportsMultipleScenes</key>
              <false/>
            </dict>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
            </dict>
            <key>NSMicrophoneUsageDescription</key>
            <string>投屏时接收并播放设备声音需要使用麦克风（WebRTC 音频单元）</string>
            <key>NSLocalNetworkUsageDescription</key>
            <string>与局域网内的云手机设备建立 WebRTC 直连需要访问本地网络</string>
            <key>UIBackgroundModes</key>
            <array><string>audio</string></array>
            <key>UIRequiredDeviceCapabilities</key>
            <array><string>arm64</string></array>
            <key>ITSAppUsesNonExemptEncryption</key>
            <false/>
            <key>CFBundleIcons</key>
            <dict>
              <key>CFBundlePrimaryIcon</key>
              <dict>
                <key>CFBundleIconFiles</key>
                <array>
                  <string>AppIcon60x60</string>
                  <string>AppIcon76x76</string>
                </array>
              </dict>
            </dict>
          </dict>
          </plist>
          PLIST
          plutil -convert binary1 -o "$APP/Info.plist" -- "$RUNNER_TEMP/Info.plist"
          echo "Info.plist patched:"
          plutil -p "$APP/Info.plist" | grep -E 'CFBundleDisplayName|CFBundleShortVersion|CFBundleIconFiles|NSAllowsArbitrary' || true
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$RUNNER_TEMP/WebrtcPhone-unsigned.ipa" Payload
          echo "IPA created at $RUNNER_TEMP/WebrtcPhone-unsigned.ipa"
          ls -lh "$RUNNER_TEMP/WebrtcPhone-unsigned.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebrtcPhone-iOS-unsigned-IPA
          path: ${{ runner.temp }}/WebrtcPhone-unsigned.ipa
          if-no-files-found: error

      - name: Zip dSYM (crash symbolication)
        run: |
          if [ -d "$RUNNER_TEMP/WebrtcPhone.xcarchive/dSYMs" ]; then
            cd "$RUNNER_TEMP" && zip -qry WebrtcPhone-dSYM.zip WebrtcPhone.xcarchive/dSYMs
            ls -lh WebrtcPhone-dSYM.zip
          else
            echo "No dSYMs in archive (DEBUG_INFORMATION_FORMAT not dwarf-with-dsym)" >&2
          fi

      - name: Upload dSYM artifact (crash symbolication)
        uses: actions/upload-artifact@v4
        with:
          name: WebrtcPhone-iOS-dSYM
          path: ${{ runner.temp }}/WebrtcPhone-dSYM.zip
          if-no-files-found: warning

      - name: Publish to GitHub Release (on v* / ios-* tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ runner.temp }}/WebrtcPhone-unsigned.ipa
            ${{ runner.temp }}/WebrtcPhone-dSYM.zip
          generate_release_notes: true
          overwrite_files: true
          append_body: true
          body: |
            ## iOS 客户端（未签名 IPA）
            由 `build-ios.yml` 自动构建。此为未签名标准 IPA：
            - TrollStore：直接打开安装（支持 iOS 14.0–16.6.1 / 17.0）
            - 企业/个人签名：下载后用签名工具重签再安装
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
