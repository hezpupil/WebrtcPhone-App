name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*', 'android-*']
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build signed release APK'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Build & Test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Fetch agent binaries from latest ScrcpyOverWebRTC release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-agent-assets.sh

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Decode keystore (optional)
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret detected, decoding..."
            mkdir -p "$RUNNER_TEMP/keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
            echo "keystore_path=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_OUTPUT"
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "No keystore secret configured, skipping release signing."
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build signed release APK (if keystore configured)
        if: steps.decode_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_FILE: ${{ steps.decode_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WebrtcPhone-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload test reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/

      - name: Publish to GitHub Release (on v* / android-* tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
          generate_release_notes: true
          append_body: true
          body: |
            ## Android 客户端
            由 `build-android.yml` 自动构建。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
